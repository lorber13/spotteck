[package]
name = "spotteck-spotify"
description = "Spotteck's connection to Spotify through librespot: login, Spotify Connect playback, library and the visualizer tap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
spotteck-core.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tokio.workspace = true
futures-util = "0.3"
protobuf = "3.7"
librespot-core = "=0.8.0"
librespot-connect = "=0.8.0"
librespot-metadata = "=0.8.0"
librespot-oauth = "=0.8.0"
librespot-protocol = "=0.8.0"
librespot-playback = { version = "=0.8.0", default-features = false, features = ["rodio-backend", "native-tls"] }

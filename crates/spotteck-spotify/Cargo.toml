[package]
name = "spotteck-spotify"
description = "Spotteck's connection to Spotify through the official Web API: PKCE login with the user's Client ID, playback control of the user's Spotify apps, and the library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
spotteck-core.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
open = "5"

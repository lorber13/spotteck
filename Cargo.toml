[workspace]
resolver = "2"
members = ["crates/spotteck-core"]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
spotteck-core = { path = "crates/spotteck-core" }
spotteck-spotify = { path = "crates/spotteck-spotify" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

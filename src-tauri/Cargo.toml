[package]
name = "spotteck"
description = "Spotteck: a Braun-style remote for Spotify Premium with analog visualizers, built on the official Web API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
spotteck-core.workspace = true
spotteck-spotify.workspace = true
spotteck-capture.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tokio.workspace = true
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-window-state = "=2.5.0"
open = "5"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
